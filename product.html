<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product | XIAOTU OUTDOOR</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="product">
<nav class="nav" id="nav"></nav>

<section class="section">
  <div class="container">
    <p class="crumb"><a href="index.html" id="crumbHome">Home</a> / <a href="products.html" id="crumbCat"></a></p>
    <div class="detail" style="margin-top:18px">
      <div class="photo"><img id="pImg" src="" alt=""></div>
      <div>
        <span class="code" id="pCode" style="font-size:13px;font-weight:800;letter-spacing:.1em;color:var(--khaki)"></span>
        <h1 id="pName"></h1>
        <p class="tag" id="pTag"></p>
        <div class="spec-title" id="specTitle"></div>
        <table class="spec-table"><tbody id="specRows"></tbody></table>
        <div class="quote-box">
          <p id="quoteText"></p>
          <a class="btn btn-wa" id="waBtn" href="#" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="section tight" style="background:#fff">
  <div class="container">
    <div class="sec-head"><h2 id="relatedTitle"></h2></div>
    <div class="prod-grid" id="relatedGrid"></div>
  </div>
</section>

<footer id="foot"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
